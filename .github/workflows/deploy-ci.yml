name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # -------------------------
      # Checkout Repository
      # -------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------
      # Configure AWS
      # -------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # -------------------------
      # Deploy Backend
      # -------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build Backend
        working-directory: backend
        run: sam build

      - name: Deploy Backend
        working-directory: backend
        run: |
          sam deploy \
            --stack-name event-ticketing-system \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region us-east-1

      # -------------------------
      # Build Frontend
      # -------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-event-ticketing/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend-event-ticketing
        run: npm ci

      - name: Build Frontend
        working-directory: frontend-event-ticketing
        env:
          NEXT_PUBLIC_API_BASE_URL: https://ozzn5awl2c.execute-api.us-east-1.amazonaws.com
        run: npm run build

      # -------------------------
      # Upload Frontend to S3
      # -------------------------

      - name: Upload Frontend to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          aws s3 sync frontend-event-ticketing/out s3://$S3_BUCKET --delete

      # -------------------------
      # Clear CloudFront Cache
      # -------------------------

      - name: Invalidate CloudFront Cache
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"